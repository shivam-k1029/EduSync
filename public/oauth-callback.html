<!DOCTYPE html>
<html>
<head>
  <title>EduSync — Connecting...</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; font-family: 'DM Sans', sans-serif; background: #F4F2ED; }
    .box { text-align: center; padding: 40px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #E4E0D6;
               border-top-color: #4F46E5; border-radius: 50%;
               animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6B6455; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Completing sign-in…</p>
  </div>
  <script>
    (function () {
      var hash = window.location.hash.slice(1);
      var params = new URLSearchParams(hash);
      var token = params.get('access_token');
      var error = params.get('error');

      if (window.opener) {
        window.opener.postMessage(
          token
            ? { type: 'GOOGLE_OAUTH_TOKEN', token: token }
            : { type: 'GOOGLE_OAUTH_TOKEN', error: error || 'No token in redirect.' },
          window.location.origin
        );
        setTimeout(function () { window.close(); }, 300);
      } else {
        // Fallback — shouldn't happen, but close anyway
        document.querySelector('p').textContent = 'Done. You can close this tab.';
      }
    })();
  </script>
</body>
</html>
